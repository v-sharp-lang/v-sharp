# Gradle must run on a JDK 25, because every module targets Java 25 and the compiler uses
# the Class-File API. If the Gradle launcher JVM is older, point this at a JDK 25 instead of
# changing the toolchain:
#
#   org.gradle.java.home=/path/to/jdk-25
#
# or export JAVA_HOME=/path/to/jdk-25 before invoking Gradle.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
